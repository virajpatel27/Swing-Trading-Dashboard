name: Backfill history

# One-time history download 2007 -> today, in resumable batches (each run continues where the last one stopped).
# Run by hand: Actions -> Backfill history -> Run workflow. Run it again until the Summary says nothing is left.
# BSE indices cannot run here (BSE refuses GitHub's servers): they are fetched from the PC with
#   python scripts/backfill.py --job bse-indices
# The data is saved ONLY when the data check passes (no empty files, no duplicates, no big row drop ...).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "What to download"
        type: choice
        options: [stocks, nse-indices, classification, delivery]
        default: stocks
      max_minutes:
        description: "Stop cleanly after this many minutes (the whole job may run at most 6 hours)"
        default: "240"
      symbols:
        description: "stocks only: comma-separated symbols that are new on NSE (empty = all stocks)"
        default: ""
      from_date:
        description: "with symbols: first day, e.g. 2007-01-01"
        default: "2007-01-01"
      restart_from:
        description: "stocks only, all stocks: read again from this day, e.g. 2007-01-01 (empty = continue from the checkpoint)"
        default: ""

permissions:
  contents: write

concurrency:
  group: data-write                  # never two jobs writing data at the same time
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                    # the newest main, not the commit of the moment this run was queued
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Remember the data list before the run
        run: cp data/meta/instruments.csv /tmp/instruments_before.csv 2>/dev/null || true
      - name: Backfill
        env:
          JOB: ${{ inputs.job }}
          MAX: ${{ inputs.max_minutes }}
          SYMBOLS: ${{ inputs.symbols }}
          FROM_DATE: ${{ inputs.from_date }}
          RESTART: ${{ inputs.restart_from }}
        run: |
          case "$JOB" in
            stocks)
              if [ -n "$SYMBOLS" ]; then
                python scripts/backfill.py --job stocks --max-minutes "$MAX" --symbols "$SYMBOLS" --from "$FROM_DATE"
              elif [ -n "$RESTART" ]; then
                python scripts/backfill.py --job stocks --max-minutes "$MAX" --restart-from "$RESTART"
              else
                python scripts/backfill.py --job stocks --max-minutes "$MAX"
              fi
              python scripts/build_adjusted.py
              python scripts/fetch_classification.py --max-minutes 15 ;;
            nse-indices)
              python scripts/backfill.py --job nse-indices --max-minutes "$MAX" ;;
            classification)
              python scripts/fetch_classification.py --max-minutes "$MAX" ;;
            delivery)
              python scripts/backfill.py --job delivery --max-minutes "$MAX" ;;
          esac
          python scripts/audit_stocks.py --master-only     # stocks.csv only; the audit report is made on the PC
          python scripts/build_groups.py                   # themes + sector / industry / theme indices
          python scripts/build_snapshot.py
      - name: Data check
        run: |
          if [ -f /tmp/instruments_before.csv ]; then
            python scripts/validate_data.py --baseline /tmp/instruments_before.csv
          else
            python scripts/validate_data.py
          fi
      - name: Save data
        id: save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: backfill ${{ inputs.job }} $(date -u +%F)"
            git pull --rebase --autostash      # files outside data/ (reports) must not block the pull
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:                            # the website shows the new data right away
    needs: backfill
    if: needs.backfill.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
