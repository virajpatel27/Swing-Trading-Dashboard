name: Daily update

# Every weekday (Viraj, 03-Nov-2026: "data by 4:30 PM"). NSE's bhavcopy is out ~16:33 IST; the allIndices API has every
# NSE index's close right after 15:30. A run takes ~15 min + 2 min website, so with GitHub on time the site shows the day ~17:00.
#   16:40 IST  stocks + same-day NSE index values, corporate actions, adjusted prices, indicators, website
#   17:20, 18:30 IST  retries (GitHub sometimes starts scheduled runs late or skips them - by hours on 02/03-Nov-2026)
#   23:50 IST  NSE's official all-indices file (~23:20 IST) replaces the same-day index values
#   08:00 IST  last safety run (next morning)
# This job does not use Angel One, so it cannot clash with the old Stock-Live-Dashboard's 17:00 IST Angel job.
# Missed days are caught up automatically (each run starts from the last saved day and re-reads the last 5 trading days).
# Holidays / nothing new: no file changes -> nothing committed, website not rebuilt.
# The data is committed ONLY when the data check passes. On failure a GitHub issue is opened (and Telegram, if set up).
# Run by hand: Actions -> Daily update -> Run workflow.
on:
  schedule:
    - cron: "10 11 * * 1-5"         # 16:40 IST
    - cron: "50 11 * * 1-5"         # 17:20 IST
    - cron: "0 13 * * 1-5"          # 18:30 IST
    - cron: "20 18 * * 1-5"         # 23:50 IST
    - cron: "30 2 * * 2-6"          # 08:00 IST (next morning)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write                 # never together with a backfill or another daily run
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                    # the newest main, not the commit of the moment this run was queued
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Corporate-action cache (old years, saves NSE calls)
        uses: actions/cache@v4
        with:
          path: cache
          key: nse-ca-${{ github.run_id }}
          restore-keys: nse-ca-
      - name: Remember the data list before the run
        run: cp data/meta/instruments.csv /tmp/instruments_before.csv
      - name: Daily update
        run: python scripts/daily.py --max-minutes 150
      - name: Data check
        run: python scripts/validate_data.py --baseline /tmp/instruments_before.csv
      - name: Save data
        id: save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new (holiday, weekend or already up to date)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase --autostash      # files outside data/ (reports) must not block the pull
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report the failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily update failed on $(TZ=Asia/Kolkata date '+%d-%b-%Y %H:%M') IST. Nothing was saved, the website shows the last good data. Details: $RUN_URL . The next run tries again and catches up missed days by itself."
          gh label create daily-failure --color B60205 --description "Daily update failed" 2>/dev/null || true
          open=$(gh issue list --label daily-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Daily update failed" --label daily-failure --body "$body"; fi
      - name: Report the failure (Telegram, optional)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram not set up - skipped."; exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=Swing Trading Dashboard: daily update failed. ${RUN_URL}"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
