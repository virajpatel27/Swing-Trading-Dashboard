name: Daily update

# Schedule (Viraj, 21-Nov-2026), every start comes from cron-job.org (GitHub's own schedule started runs hours late):
#   Run 1   17:10 IST Mon-Fri  stock prices (bhavcopy ~16:33) + delivery % (MTO ~16:50), website      mode: full
#   Run 2   23:40 IST Mon-Fri  NSE's official index closes (~23:20) + corporate actions, website     mode: full
#   Backup  05:00 IST Tue-Sat  only when the last session is not complete, else ends in ~1 minute   mode: backup
#   Weekly  07:00 IST Sat      catch up anything of the week (re-reads the last 5 trading days); the Weekly backup
#                              (07:05) waits for it (same data-write lock)                           mode: full
# cron-job.org calls POST .../actions/workflows/daily.yml/dispatches with {"ref":"main","inputs":{"mode":"full"}}
# (or "backup"); docs/MANUAL_CHECKLIST.md has the jobs. Run by hand: Actions -> Daily update -> Run workflow.
# This job does not use Angel One, so it cannot clash with the old Stock-Live-Dashboard's 17:00 IST Angel job.
# Missed days are caught up automatically (each run starts from the last saved day and re-reads the last 5 trading days).
# Holidays / nothing new: no file changes -> nothing committed, website not rebuilt.
# The data is committed ONLY when the data check passes. On failure a GitHub issue is opened (and Telegram, if set up).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = always run; backup = only when the last session is not complete"
        type: choice
        options: [full, backup]
        default: full

permissions:
  contents: write
  issues: write

concurrency:
  group: data-write                 # never together with a backfill or another daily run
  cancel-in-progress: false

jobs:
  gate:                             # a backup run with nothing to do ends here (~1 minute)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            scripts/run_gate.py
            swingdash/run_gate.py
            swingdash/__init__.py
            data/meta/trading_days.csv
            data/meta/checkpoints/nse_indices.json
          sparse-checkout-cone-mode: false
      - name: Anything to do?
        id: check
        run: python3 scripts/run_gate.py --mode "${{ inputs.mode || 'full' }}"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                    # the newest main, not the commit of the moment this run was queued
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Corporate-action cache (old years, saves NSE calls)
        uses: actions/cache@v4
        with:
          path: cache
          key: nse-ca-${{ github.run_id }}
          restore-keys: nse-ca-
      - name: Remember the data list before the run
        run: cp data/meta/instruments.csv /tmp/instruments_before.csv
      - name: Daily update
        run: python scripts/daily.py --max-minutes 150
      - name: Data check
        run: python scripts/validate_data.py --baseline /tmp/instruments_before.csv
      - name: Save data
        id: save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new (holiday, weekend or already up to date)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase --autostash      # files outside data/ (reports) must not block the pull
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Report the failure (GitHub issue)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily update failed on $(TZ=Asia/Kolkata date '+%d-%b-%Y %H:%M') IST. Nothing was saved, the website shows the last good data. Details: $RUN_URL . The next run tries again and catches up missed days by itself."
          gh label create daily-failure --color B60205 --description "Daily update failed" 2>/dev/null || true
          open=$(gh issue list --label daily-failure --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Daily update failed" --label daily-failure --body "$body"; fi
      - name: Report the failure (Telegram, optional)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Telegram not set up - skipped."; exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=Swing Trading Dashboard: daily update failed. ${RUN_URL}"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
