name: Deploy website

# Builds the website (snapshot + one chart file per stock/index) and publishes it on GitHub Pages.
# Runs when the site or the snapshot changes on main, by hand (Actions -> Deploy website -> Run workflow),
# and is called by the daily update (bot commits do not start other workflows by themselves).
# One-time setting needed: repository Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "data/snapshot/**", "swingdash/site_build.py", "scripts/build_site.py", "swingdash/engine.py",
            "swingdash/screen.py", "config/indicators.yaml", "config/stage.yaml", "config/scanners.json", "config/fields.yaml",
            ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                    # when called after a data commit, build from the newest main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Screen snapshot (every indicator field per stock; not kept in git)
        run: python scripts/build_screen.py
      - name: Build site
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
