name: Results season

# Quarterly results (Viraj, 21-Nov-2026): cron-job.org starts this every day at 13:00, 16:00 and 19:30 IST. It works only
# in the results seasons (10 Jul - 14 Aug, 10 Oct - 14 Nov, 10 Jan - 14 Feb, 15 Apr - 30 May); on other days it ends in
# about a minute. Our filings data: ~53 % of results are on NSE by 13:00, ~72 % by 16:00, ~95 % by 19:30; the rest come
# with the next run (the daily runs at 17:10 / 23:40 read new results files too).
#   1. new results / shareholding files NSE listed since the last read (scripts/fundamentals_results.py)
#   2. stocks never read yet (new listings), at most 15 minutes
# Shares the "data-write" lock with the daily update. Run by hand: Actions -> Results season -> Run workflow (mode full
# also works outside a season).
# cron-job.org calls POST .../actions/workflows/fundamentals-nightly.yml/dispatches with {"ref":"main","inputs":{"mode":"season"}}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "season = only in a results season; full = always"
        type: choice
        options: [season, full]
        default: full

permissions:
  contents: write

concurrency:
  group: data-write                 # never together with the daily update or a backfill
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: |
            scripts/run_gate.py
            swingdash/run_gate.py
            swingdash/__init__.py
          sparse-checkout-cone-mode: false
      - name: Results season?
        id: check
        run: python3 scripts/run_gate.py --mode "${{ inputs.mode || 'full' }}"

  fundamentals:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: New quarterly results
        run: python scripts/fundamentals_results.py --max-minutes 25
      - name: Stocks not read yet
        run: |
          python scripts/backfill.py --job fundamentals --new-only --max-minutes 15
          python scripts/fundamentals_report.py
      - name: Data check
        run: python scripts/validate_data.py
      - name: Save data
        id: save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: results $(TZ=Asia/Kolkata date '+%F %H:%M')"
            git pull --rebase --autostash
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fundamentals
    if: needs.fundamentals.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
