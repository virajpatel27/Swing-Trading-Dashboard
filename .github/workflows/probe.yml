name: Source probe

# Read-only test of every data source FROM GITHUB's servers (NSE/BSE sometimes refuse them).
# Run by hand only: Actions -> Source probe -> Run workflow. Result: the run's Summary page + the "probe-report" file.
# Angel One checks run only when the 4 Secrets exist: ANGEL_API_KEY, ANGEL_CLIENT_ID, ANGEL_PIN, ANGEL_TOTP_SECRET.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe sources
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-report
          path: reports/probe_github.*
