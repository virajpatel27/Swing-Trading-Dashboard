# Indicator engine settings (Phase S4). Change this file, not the code. Every formula: docs/formulas.md.
benchmark: NIFTY_SMALLCAP_250     # default RS line benchmark (NSE index folder id) - the reference's default; its
                                  # "RS line at 52W high" matches 99.3 % with it (03-Nov). Others: NIFTY_50, NIFTY_500, NIFTY_MIDCAP_150
beta_benchmark: NIFTY_50
rs_lines: [NIFTY_50, NIFTY_500, NIFTY_MIDCAP_150, NIFTY_SMALLCAP_250]

mansfield_weeks: 52               # Mansfield RS = (RS line / its 52-week average - 1) x 100 (52 weeks = 260 sessions)
relative_extension: {ma: 50, lookback: 250}
trend_intensity: {fast: 7, slow: 65}
bollinger: {length: 20, std: 2}
supertrend: {length: 10, multiplier: 3}
swing_bands: {fast: 8, slow: 14, volume_factor: 0.65}
adr_length: 20

volume:
  high_volume_x: 1.5              # "high volume" day = volume >= 1.5 x its 20-day average (chart colour default)
  pocket_pivot_days: 10           # pocket pivot: up day whose volume beats every DOWN day's volume of the last 10 days
  dry_up_days: 10                 # dry-up: lowest volume of the last 10 days AND below dry_up_x of the 50-day average
  dry_up_x: 0.5
  quarter: 63                     # HVQ / LVQ window (sessions)
  year: 252                       # HVY / LVY window

rs_rating:
  weights: {63: 0.4, 126: 0.2, 189: 0.2, 252: 0.2}   # IBD-style: recent quarter counts double
  min_sessions: 10                # fewer sessions: no RS rating; up to 252 the available periods are used, under 63 the
                                  # return since the first session (07-Nov: the reference rates from the 11th session)
  universe: all                   # percentile rank among ALL stocks with a score that day (calibrated: 77 % within 3
                                  # points of the reference, correlation 0.98; "liquid" only: 57 %)

events:                           # event scans (engine.events), calibrated 07-Nov-2026 on 4 days of reference lists
  window: 5                       # an event counts for 5 sessions after its day
  hv_move_x: 2.0                  # high volume: up >= 2 x the previous day's ADR %
  hv_close_pos: 75                #   close in the top quarter of the day's range
  hv_lookback: 63                 #   volume above every volume of the previous 63 sessions (a quarter)
  br_high: 13                     # big reversal: high >= 13 % and close >= 12 % over the previous close
  br_close: 12
  br_rvol: 3                      #   volume >= 3 x the previous 20-day average
  br_below: 6                     #   previous close >= 6 % under SMA200
  s2b_rvol: 2.0                   # Stage 2 breakout: close above the previous 50-day high on >= 2 x 20-day volume, Stage 2
  s2b_window: 6                   #   kept 6 sessions
  so_min_drop: 1.5                # shakeout: intraday drop >= 1.5 % and >= the usual daily range,
  so_sma50_tol: 3                 #   low within 3 % of SMA50 (close before it above SMA50),
  so_recovery: 2                  #   back to the close before the drop within 2 sessions, in an uptrend
  rb_swing: 8                     # recent breakout: resistance = swing high (highest of +-8 bars),
  rb_min_age: 26                  #   at least 26 sessions old, after a rise of >= 20 %,
  rb_prior: 0.2
  rb_rvol: 2.0                    #   broken by a close on >= 2 x 20-day volume within 4 sessions,
  rb_window: 4
  rb_above: 5                     #   today >= 5 % above the level, Stage 2 today
  base_swing: 16                  # daily base / near pivot level: swing high = highest of +-16 sessions,
  base_min_age: 22                #   22..168 sessions old, after a 20 % rise, no close above it since
  base_max_age: 168
  wbase_swing: 4                  # weekly base: the same on weekly candles, +-4 weeks, 17..71 weeks old
  wbase_min_age: 17
  wbase_max_age: 71
  ipo_max_bars: 30                # IPO base: stocks with at most 30 sessions
  rsb_benchmark: NIFTY_MIDSMALLCAP_400   # RS before price: RS line vs this index above its 50-session high today,
  rsb_lookback: 50                #   close 0-10 % under its highest close of the previous 50 sessions
  rsb_max_below: 10               #   (10-Nov-2026: their index IS this one - rs_above_high reproduced exactly)
  rsb_index_lag: 1                # today's RS point uses the previous session's index close, as the reference does
  vcp_min_base: 15                # VCP: pivot (base high) 15..34 sessions back, no close above it since,
  vcp_max_base: 34
  vcp_swing: 0.03                 #   swing lows need a 3 % bounce, 3 shrinking pullbacks (pivot->L1, H1->L2, H2->L3),
  vcp_first_max: 25               #   1st <= 25 %, last <= 8 %, close <= 10 % under the pivot,
  vcp_last_max: 8
  vcp_dist_max: 10
  vcp_pivot_vs_hi52: 7            #   pivot within 7 % of the 52-week high, 2nd pullback <= 0.6 x the 1st,
  vcp_mid_ratio: 0.6
  vcp_window: 2                   #   shown for 2 sessions after the day it first appears
  vcp_fresh: 5                    #   (not when the same base was a VCP in the 5 sessions before)
