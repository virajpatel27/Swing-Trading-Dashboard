# Themes (Phase S3): our own lists, rebuilt every day into data/meta/themes.csv by swingdash/themes.py.
# A stock may be in several themes. Edit THIS file (not themes.csv):
#   nse_indices      every member of these official NSE indices joins (source "NSE index ..."; highest confidence)
#   basic_industries every stock of these NSE basic industries joins (source "NSE industry ...")
#   symbols          stocks added by hand (source "manual - check"; please review them)
#   exclude          stocks never in this theme
# The NSE index members come from each stock's NSE quote (classification.csv -> indices), so index rebalances flow in.

themes:
  Defence:
    nse_indices: [NIFTY INDIA DEFENCE]
    basic_industries: [Aerospace & Defense]
  Railways:
    nse_indices: [NIFTY INDIA RAILWAYS PSU]
    basic_industries: [Railway Wagons]
    symbols: [TITAGARH, TEXRAIL, JWL, KERNEX, HBLENGINE, BEML, RKFORGE]
  EV & New-age Auto:
    nse_indices: [NIFTY EV & NEW AGE AUTOMOTIVE]
  Internet & New-age Tech:
    nse_indices: [NIFTY INDIA INTERNET]
    basic_industries: [E-Retail/ E-Commerce, Internet & Catalogue Retail, Web based media and service, Financial Technology (Fintech)]
  AI & Data:
    nse_indices: [NIFTY AI CATALYSTS]
  Capital Markets:
    nse_indices: [NIFTY CAPITAL MARKETS]
