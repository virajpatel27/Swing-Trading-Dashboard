# What the dashboard covers. Change this file, not the code.
history_start: 2007-01-01

stocks:
  source: all_nse_eq                 # all_nse_eq = every NSE main-board stock (Viraj, 2026-11-01); nifty500 = Nifty 500 only
  all_list_url: https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv
  list_url: https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv   # also marks Nifty 500 members (n500)
  series_priority: [EQ, BE, BZ, SM, ST, RR, IV]   # one row per day: the first series found in this order (RR = REIT, IV = InvIT)
  exclude_prefixes: [DUMMY]          # NSE lists placeholder symbols (e.g. DUMMYHEG) that never trade

indices:
  nse: all                           # every index in NSE's allIndices list (discovered, not hard-coded)
  nse_skip_categories: []            # e.g. ["FIXED INCOME INDICES"]
  bse: all                           # every index in BSE's index list (FillddlIndex)
