<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Swing Trading Dashboard</title>
  <meta name="description" content="NSE and BSE indices and every NSE main-board stock for swing traders: adjusted prices since 2007, indicators, charts, screener, sectors.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=__BUILD__">
  <script>
    // theme before first paint (no flash): saved choice, else the system setting
    try { const t = localStorage.getItem("sd-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <nav class="rail" aria-label="Main">
    <a class="rail-logo" href="#/" title="Home"><img class="logo" src="icons/logo.svg" alt="V logo" width="30" height="27"></a>
    <div class="rail-main">
      <a href="#/" data-tab="home" title="Home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a>
      <a href="#/scanners" data-tab="scanners" title="Scanners"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 12l5-5"/></svg><span>Scanners</span></a>
      <a href="#/groups" data-tab="groups" title="Groups"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Groups</span></a>
      <a href="#/breadth" data-tab="breadth" title="Breadth"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Breadth</span></a>
      <a href="#/watchlist" data-tab="watchlist" title="Watchlist"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Watchlist</span></a>
    </div>
    <div class="rail-end">
      <button id="theme" type="button" aria-label="Switch dark / light mode" title="Dark / light mode"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg><span>Theme</span></button>
      <button id="about" type="button" aria-label="About and disclaimer" title="About and disclaimer"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>About</span></button>
    </div>
  </nav>
  <div class="frame">
    <header class="top">
      <a class="brand" href="#/"><img class="logo" src="icons/logo.svg" alt="" width="26" height="23"><span>Swing Trading Dashboard</span></a>
      <nav class="pages" aria-label="Pages">
        <span class="pg-lbl">Pages</span>
        <div id="pgTabs" class="pg-tabs" role="list"></div>
        <div class="pg-addw"><button id="pgAdd" class="pg-add" type="button" aria-haspopup="menu" aria-expanded="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add page</span></button>
          <div id="pgMenu" class="menu pg-menu" role="menu" hidden></div></div>
      </nav>
      <span id="asof" class="asof"></span>
    </header>
    <main id="view" class="card" tabindex="-1">
      <div class="skel-page" aria-label="Loading"><i class="skel h"></i><i class="skel s"></i><i class="skel bar"></i>
        <i class="skel row"></i><i class="skel row"></i><i class="skel row"></i><i class="skel row"></i><i class="skel row"></i><i class="skel row"></i></div>
    </main>
  </div>
  <footer class="statusbar">
    <div id="stPage" class="st-page"></div>
    <div id="status" class="st-l" role="status">Loading…</div>
    <div class="st-r">End-of-day data · <b>Educational purpose only, not investment advice</b> · <a href="#" id="about2">About</a></div>
  </footer>
  <template id="aboutTpl">
    <p><strong>Educational purpose only, not investment advice.</strong> End-of-day data; it may contain errors.</p>
    <p>Sources: NSE (bhavcopy, indices, corporate actions, classification, results filings), BSE (indices). Stock prices are
      adjusted for splits, bonus, rights and demergers. Every formula: <a href="#/fields">fields and formulas</a>.</p>
    <p>Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> Lightweight Charts™.</p>
  </template>
  <script src="logic.js?v=__BUILD__"></script>
  <script src="ind.js?v=__BUILD__"></script>
  <script src="scan.js?v=__BUILD__"></script>
  <script src="fin.js?v=__BUILD__"></script>
  <script src="chart.js?v=__BUILD__"></script>
  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
